<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ned</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232563eb%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #1b1f24;
    --muted: #6b7280;
    --border: #e3e6ea;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --ok: #16a34a;
    --warn: #d97706;
    --err: #dc2626;
    --info: #0891b2;
    --chip: #eef0f3;
    --chip-on: #dbeafe;
    --row-alt: #fafbfc;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --card: #171b21;
      --fg: #e6e8eb;
      --muted: #8b949e;
      --border: #272d35;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --info: #22d3ee;
      --chip: #20262e;
      --chip-on: #1e3a5f;
      --row-alt: #1b2027;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font: inherit;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .55; cursor: progress; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--fg); border-color: var(--border); }
  input, select {
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
  }
  input[type=number] { width: 90px; }
  input[type=time] { width: 110px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 12px 16px; margin-bottom: 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  header.top h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.off { background: var(--err); }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta b { color: var(--fg); font-weight: 500; }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
    background: var(--chip); color: var(--muted); border: 1px solid var(--border);
  }
  .badge.quiet { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); border-color: transparent; }
  .busy-note { font-size: 12px; color: var(--muted); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  section.card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 16px; box-shadow: var(--shadow);
  }
  section.card > .hd {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  section.card > .hd h2 { font-size: 15px; margin: 0; font-weight: 600; }
  section.card > .hd .count { color: var(--muted); font-size: 13px; }
  section.card > .bd { padding: 12px 16px; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

  /* attention */
  .att { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .att:last-child { border-bottom: 0; }
  .att .ic { font-size: 18px; width: 24px; text-align: center; flex: none; line-height: 1.3; }
  .att .tx { flex: 1; min-width: 0; }
  .att .tt { font-weight: 500; }
  .att .dt { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .att .ts { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .att .op { flex: none; display: flex; gap: 6px; }

  /* sessions table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.wt { font-weight: 500; white-space: nowrap; }
  td.sm { color: var(--muted); max-width: 520px; word-break: break-word; }
  td.num { text-align: center; }
  td.rel { white-space: nowrap; color: var(--muted); }
  .st { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .st.running { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .st.waiting { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .st.done { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .st.error { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
  .st.ended { background: var(--chip); color: var(--muted); }
  .table-wrap { overflow-x: auto; }

  /* briefings */
  details.bf { border-bottom: 1px solid var(--border); }
  details.bf:last-child { border-bottom: 0; }
  details.bf summary {
    display: flex; gap: 10px; align-items: center; padding: 9px 0; cursor: pointer; list-style: none;
  }
  details.bf summary::-webkit-details-marker { display: none; }
  details.bf summary .caret { color: var(--muted); font-size: 11px; width: 10px; transition: transform .15s; }
  details.bf[open] summary .caret { transform: rotate(90deg); }
  details.bf.ok summary { opacity: .6; }
  details.bf summary .hl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.bf summary .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.daily { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
  .tag.update { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .tag.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .bf-body { padding: 4px 0 12px 20px; }
  .bf-body h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .bf-body ul { margin: 0; padding-left: 18px; }
  .bf-body li { margin: 3px 0; }
  .bf-body li .d { color: var(--muted); font-size: 13px; }
  .bf-body .cost { color: var(--muted); font-size: 12px; margin-top: 10px; }
  pre.raw {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; margin: 6px 0 0;
  }

  /* timeline */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  .chips .lbl { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .chip {
    font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--fg);
    border: 1px solid transparent; cursor: pointer; user-select: none;
  }
  .chip.on { background: var(--chip-on); border-color: var(--accent); color: var(--accent); }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .tl li:last-child { border-bottom: 0; }
  .tl .t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl .ev { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .tl .kind { font-weight: 500; }
  .tl .wt { color: var(--muted); }
  .tl .msg { color: var(--muted); width: 100%; word-break: break-word; }
  .tl li.brief .kind { color: var(--accent); }
  .tl .day { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 6px; }

  /* settings */
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .form .f { display: flex; flex-direction: column; gap: 4px; }
  .form .f label { font-size: 12px; color: var(--muted); }
  .form .f .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .form .f.full { grid-column: 1 / -1; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg); cursor: pointer; }
  .form-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .form-foot .msg { font-size: 13px; color: var(--muted); }
  .form-foot .msg.ok { color: var(--ok); }
  .form-foot .msg.err { color: var(--err); }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: 90vw;
  }
  .toast.show { opacity: .95; }

  @media (max-width: 640px) {
    .wrap { padding: 10px; }
    header.top { padding: 10px 12px; }
    section.card > .bd, section.card > .hd { padding-left: 12px; padding-right: 12px; }
    .form { grid-template-columns: 1fr; }
    th.hide-sm, td.hide-sm { display: none; }
    .tl li { grid-template-columns: 46px 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="dot" id="alive-dot" title="daemon"></span>Ned</h1>
    <div class="meta">
      <span id="alive-text">—</span>
      <span>마지막 점검 <b id="last-hb">—</b></span>
      <span>다음 점검 <b id="next-hb">—</b></span>
      <span id="quiet-badge" class="badge quiet" hidden>🌙 조용한 시간</span>
      <span id="last-brief" class="badge" hidden></span>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <span class="busy-note" id="busy-note" hidden></span>
      <button id="btn-hb" class="primary">지금 점검</button>
      <button id="btn-daily">아침 브리핑 생성</button>
    </div>
  </header>

  <section class="card" id="sec-attention">
    <div class="hd"><h2>지금 봐야 할 것</h2><span class="count" id="att-count"></span></div>
    <div class="bd" id="attention"></div>
  </section>

  <section class="card" id="sec-sessions">
    <div class="hd"><h2>에이전트 세션</h2><span class="count" id="sess-count"></span></div>
    <div class="bd table-wrap" id="sessions"></div>
  </section>

  <section class="card" id="sec-briefings">
    <div class="hd">
      <h2>브리핑 히스토리</h2><span class="count" id="bf-count"></span>
      <span class="spacer"></span>
      <button class="small ghost" data-refresh="briefings">새로 고침</button>
    </div>
    <div class="bd" id="briefings"></div>
  </section>

  <section class="card" id="sec-timeline">
    <div class="hd">
      <h2>타임라인</h2><span class="count" id="tl-count"></span>
      <span class="spacer"></span>
      <button class="small ghost" data-refresh="events">새로 고침</button>
    </div>
    <div class="bd">
      <div class="chips" id="chips-type"></div>
      <div class="chips" id="chips-wt"></div>
      <ul class="tl" id="timeline"></ul>
    </div>
  </section>

  <section class="card" id="sec-config">
    <div class="hd">
      <h2>설정</h2>
      <span class="spacer"></span>
      <button class="small ghost" data-refresh="config">다시 불러오기</button>
    </div>
    <div class="bd">
      <form id="cfg" autocomplete="off">
        <div class="form">
          <div class="f">
            <label for="c-hb">heartbeat 간격 (분)</label>
            <input id="c-hb" name="heartbeat_minutes" type="number" min="1" step="1" required>
          </div>
          <div class="f">
            <label for="c-sig">신호 조회 최소 간격 (분)</label>
            <input id="c-sig" name="signal_check_minutes" type="number" min="1" step="1" required>
          </div>
          <div class="f">
            <label for="c-bt">아침 브리핑 시각</label>
            <input id="c-bt" name="briefing_time" type="time" required>
          </div>
          <div class="f">
            <label>조용한 시간 (알림 없음)</label>
            <div class="row">
              <label style="display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--fg)"><input type="checkbox" id="c-qon"> 사용</label>
              <input type="time" id="c-qs"> <span style="color:var(--muted)">~</span> <input type="time" id="c-qe">
            </div>
          </div>
          <div class="f full">
            <label>업무 신호 소스</label>
            <div class="toggles" id="c-sources"></div>
          </div>
          <div class="f">
            <label for="c-model">Claude 모델 (비우면 기본값)</label>
            <input id="c-model" name="claude_model" type="text" placeholder="예: claude-sonnet-5-5" style="width:100%">
          </div>
          <div class="f">
            <label for="c-turns">Claude 최대 턴</label>
            <input id="c-turns" name="claude_max_turns" type="number" min="1" step="1" required>
          </div>
        </div>
        <div class="form-foot">
          <button type="submit" class="primary" id="c-save">저장</button>
          <span class="msg" id="c-msg"></span>
        </div>
      </form>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const ALIVE_MS = 20 * 60 * 1000;
  const POLL_MS = 10 * 1000;

  const KIND_ICON = { session: "🖥", email: "✉️", slack: "💬", jira: "📋", github: "🐙", sentry: "🐞", calendar: "📅", other: "🔔" };
  const KIND_KO = { session: "세션", email: "이메일", slack: "Slack", jira: "Jira", github: "GitHub", sentry: "Sentry", calendar: "캘린더", other: "기타" };
  const SOURCE_LABEL = { gmail: "Gmail", slack: "Slack", jira: "Jira", github: "GitHub", sentry: "Sentry", calendar: "캘린더" };
  const STATUS_KO = { running: "실행 중", waiting: "입력 대기", done: "완료", error: "오류", ended: "종료" };
  const EVENT_KO = {
    SessionStart: "세션 시작", SessionEnd: "세션 종료", UserPromptSubmit: "프롬프트",
    SubagentStart: "서브에이전트 시작", SubagentStop: "서브에이전트 종료",
    Notification: "알림", Stop: "응답 완료", StopFailure: "오류", PreCompact: "컨텍스트 압축",
  };

  const state = { state: null, events: [], briefings: [], config: null, busy: false, filterType: new Set(), filterWt: new Set() };

  // ---------- utils ----------
  const el = (tag, attrs = {}, ...children) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "hidden" || k === "checked" || k === "disabled" || k === "open") n[k] = !!v;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      n.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return n;
  };
  const basename = (p) => (p ? String(p).replace(/\/+$/, "").split("/").pop() : "");
  const pad = (n) => String(n).padStart(2, "0");
  const fmtTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const fmtDateTime = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${fmtTime(ts)}`; };
  const fmtDay = (ts) => {
    const d = new Date(ts), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, t)) return "오늘"; if (same(d, y)) return "어제";
    return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  };
  const rel = (ts) => {
    if (!ts) return "—";
    const diff = Date.now() - ts, s = Math.round(Math.abs(diff) / 1000);
    const f = diff >= 0 ? (x) => `${x} 전` : (x) => `${x} 후`;
    if (s < 45) return f(`${s}초`);
    const m = Math.round(s / 60); if (m < 60) return f(`${m}분`);
    const h = Math.round(m / 60); if (h < 36) return f(`${h}시간`);
    return f(`${Math.round(h / 24)}일`);
  };
  const toast = (msg, ms = 2600) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); };

  async function api(path, opts) {
    const r = await fetch(path, { headers: { accept: "application/json", ...(opts && opts.body ? { "content-type": "application/json" } : {}) }, ...opts });
    if (!r.ok) throw new Error(`${opts?.method ?? "GET"} ${path} → ${r.status}`);
    return r.json();
  }

  // ---------- header ----------
  function renderHeader() {
    const s = state.state; if (!s) return;
    const alive = s.updated_at && Date.now() - s.updated_at < ALIVE_MS;
    const dot = $("#alive-dot"); dot.className = `dot ${alive ? "on" : "off"}`;
    $("#alive-text").textContent = alive ? `daemon 실행 중 · 갱신 ${rel(s.updated_at)}` : s.updated_at ? `daemon 응답 없음 (마지막 갱신 ${rel(s.updated_at)})` : "daemon 상태 없음";
    $("#last-hb").textContent = s.last_heartbeat_at ? `${rel(s.last_heartbeat_at)} (${fmtTime(s.last_heartbeat_at)})` : "없음";
    $("#next-hb").textContent = s.next_heartbeat_at ? `${rel(s.next_heartbeat_at)} (${fmtTime(s.next_heartbeat_at)})` : "—";
    $("#quiet-badge").hidden = !s.quiet;
    const lb = $("#last-brief");
    if (s.last_briefing) {
      lb.hidden = false;
      lb.textContent = `마지막 브리핑 ${s.last_briefing.status === "NED_OK" ? "NED_OK" : "UPDATE"} · ${fmtDateTime(s.last_briefing.ts)}`;
      lb.title = s.last_briefing.headline ?? "";
    } else lb.hidden = true;
  }

  async function runHeartbeat(daily) {
    if (state.busy) return;
    state.busy = true;
    const b1 = $("#btn-hb"), b2 = $("#btn-daily"), note = $("#busy-note");
    b1.disabled = b2.disabled = true;
    note.hidden = false;
    note.innerHTML = `<span class="spin"></span>${daily ? "아침 브리핑 생성 중" : "점검 중"}… (1~3분 소요)`;
    const t0 = Date.now();
    const tick = setInterval(() => { note.innerHTML = `<span class="spin"></span>${daily ? "아침 브리핑 생성 중" : "점검 중"}… ${Math.round((Date.now() - t0) / 1000)}초`; }, 1000);
    try {
      const b = await api(`/api/heartbeat${daily ? "?daily=1" : ""}`, { method: "POST" });
      if (b && b.status === "skipped") toast("점검할 새 내용이 없어 건너뜀");
      else if (b && b.status) toast(`${b.status}${b.headline ? " · " + b.headline : ""}`, 5000);
      else toast("완료");
      await Promise.all([loadState(), loadBriefings(), loadEvents()]);
    } catch (e) {
      console.error(e); toast(`실패: ${e.message}`, 5000);
    } finally {
      clearInterval(tick);
      state.busy = false; b1.disabled = b2.disabled = false; note.hidden = true;
    }
  }

  // ---------- attention ----------
  function renderAttention() {
    const box = $("#attention"); box.replaceChildren();
    const items = state.state?.attention ?? [];
    $("#att-count").textContent = items.length ? `${items.length}건` : "";
    if (!items.length) { box.append(el("div", { class: "empty" }, "지금은 조용합니다. 봐야 할 것이 없어요.")); return; }
    for (const a of items) {
      box.append(el("div", { class: "att", "data-id": a.id },
        el("div", { class: "ic", title: KIND_KO[a.kind] ?? a.kind }, KIND_ICON[a.kind] ?? KIND_ICON.other),
        el("div", { class: "tx" },
          el("div", { class: "tt" }, a.title),
          a.detail ? el("div", { class: "dt" }, a.detail) : null,
          el("div", { class: "ts" }, rel(a.ts), a.url ? [" · ", el("a", { href: a.url, target: "_blank", rel: "noopener" }, "열기 ↗")] : null, a.source && a.source !== "sessions" ? ` · 브리핑 ${a.source.slice(0, 16)}` : null),
        ),
        el("div", { class: "op" },
          el("button", { class: "small", onclick: async (ev) => {
            ev.currentTarget.disabled = true;
            try { await api(`/api/attention/${encodeURIComponent(a.id)}/dismiss`, { method: "POST" }); await loadState(); }
            catch (e) { console.error(e); toast(`실패: ${e.message}`); ev.currentTarget.disabled = false; }
          } }, "닫기"),
        ),
      ));
    }
  }

  // ---------- sessions ----------
  function renderSessions() {
    const box = $("#sessions"); box.replaceChildren();
    const ss = state.state?.sessions ?? [];
    $("#sess-count").textContent = ss.length ? `${ss.length}개` : "";
    if (!ss.length) { box.append(el("div", { class: "empty" }, "활성 세션이 없습니다.")); return; }
    const tbl = el("table", {},
      el("thead", {}, el("tr", {},
        el("th", {}, "워크트리"), el("th", {}, "상태"), el("th", {}, "마지막 요약 / 프롬프트"),
        el("th", { class: "num hide-sm", title: "활성 서브에이전트" }, "서브"), el("th", {}, "최근"))),
      el("tbody", {}, ss.map((s) => el("tr", {},
        el("td", { class: "wt", title: s.cwd }, s.worktree, s.orca_worktree && s.orca_worktree !== s.worktree ? el("div", { style: "color:var(--muted);font-size:11px;font-weight:400" }, s.orca_worktree) : null),
        el("td", {}, el("span", { class: `st ${s.status}` }, STATUS_KO[s.status] ?? s.status)),
        el("td", { class: "sm" }, s.last_summary ?? (s.last_prompt ? el("span", { style: "font-style:italic" }, "» ", s.last_prompt) : "—")),
        el("td", { class: "num hide-sm" }, s.subagents_active || ""),
        el("td", { class: "rel", title: `시작 ${fmtDateTime(s.since)}` }, rel(s.last_event_ts)),
      ))),
    );
    box.append(tbl);
  }

  // ---------- briefings ----------
  function sectionList(title, xs) {
    if (!xs || !xs.length) return null;
    return [el("h4", {}, title), el("ul", {}, xs.map((x) => el("li", {},
      x.kind ? [KIND_ICON[x.kind] ?? "", " "] : null,
      x.url ? el("a", { href: x.url, target: "_blank", rel: "noopener" }, x.title) : x.title,
      x.detail ? el("div", { class: "d" }, x.detail) : null,
    )))];
  }
  function renderBriefings() {
    const box = $("#briefings"); box.replaceChildren();
    const bs = [...state.briefings].sort((a, b) => b.ts - a.ts);
    $("#bf-count").textContent = bs.length ? `${bs.length}개` : "";
    if (!bs.length) { box.append(el("div", { class: "empty" }, "아직 브리핑이 없습니다.")); return; }
    bs.forEach((b, i) => {
      const ok = b.status === "NED_OK";
      const n = (b.action_items?.length ?? 0) + (b.updates?.length ?? 0) + (b.fyi?.length ?? 0);
      const d = el("details", { class: `bf ${ok ? "ok" : ""}`, open: !ok && i < 3 },
        el("summary", {},
          el("span", { class: "caret" }, "▶"),
          el("span", { class: `tag ${b.type === "daily" ? "daily" : ""}` }, b.type === "daily" ? "아침" : "점검"),
          el("span", { class: `tag ${ok ? "ok" : "update"}` }, ok ? "NED_OK" : "UPDATE"),
          el("span", { class: "hl" }, b.headline ?? (ok ? "변화 없음" : `${n}건`)),
          el("span", { class: "when", title: new Date(b.ts).toLocaleString("ko-KR") }, fmtDateTime(b.ts)),
        ),
        el("div", { class: "bf-body" },
          b.headline ? el("div", { style: "font-weight:500" }, b.headline) : null,
          sectionList("Action Items", b.action_items),
          sectionList("Updates", b.updates),
          sectionList("FYI", b.fyi),
          sectionList("세션", b.sessions),
          !b.headline && n === 0 && !(b.sessions?.length) ? el("div", { class: "empty" }, "내용 없음") : null,
          el("div", { class: "cost" }, `id ${b.id}`, b.cost_usd != null ? ` · $${Number(b.cost_usd).toFixed(3)}` : ""),
          b.raw ? [el("h4", {}, "raw"), el("pre", { class: "raw" }, b.raw)] : null,
        ),
      );
      box.append(d);
    });
  }

  // ---------- timeline ----------
  function timelineItems() {
    const evs = state.events.map((e) => ({
      ts: e.ts, type: e.event, wt: e.orca_worktree || basename(e.cwd) || "", brief: false,
      msg: e.prompt ?? e.message ?? e.reason ?? (e.agent_type ? `agent ${e.agent_type}` : ""), raw: e,
    }));
    const bfs = state.briefings.map((b) => ({
      ts: b.ts, type: "브리핑", wt: "", brief: true,
      msg: `${b.type === "daily" ? "아침" : "점검"} · ${b.status}${b.headline ? " · " + b.headline : ""}`, raw: b,
    }));
    return [...evs, ...bfs].sort((a, b) => b.ts - a.ts);
  }
  function chip(label, set, key, onchange) {
    return el("span", { class: `chip ${set.has(key) ? "on" : ""}`, onclick: () => { set.has(key) ? set.delete(key) : set.add(key); onchange(); } }, label);
  }
  function renderTimeline() {
    const all = timelineItems();
    const types = [...new Set(all.map((x) => x.type))].sort((a, b) => (a === "브리핑" ? -1 : b === "브리핑" ? 1 : a.localeCompare(b)));
    const wts = [...new Set(all.map((x) => x.wt).filter(Boolean))].sort();
    const ct = $("#chips-type"); ct.replaceChildren(el("span", { class: "lbl" }, "유형"),
      el("span", { class: `chip ${state.filterType.size === 0 ? "on" : ""}`, onclick: () => { state.filterType.clear(); renderTimeline(); } }, "전체"),
      ...types.map((t) => chip(EVENT_KO[t] ?? t, state.filterType, t, renderTimeline)));
    const cw = $("#chips-wt"); cw.replaceChildren(el("span", { class: "lbl" }, "워크트리"),
      el("span", { class: `chip ${state.filterWt.size === 0 ? "on" : ""}`, onclick: () => { state.filterWt.clear(); renderTimeline(); } }, "전체"),
      ...wts.map((w) => chip(w, state.filterWt, w, renderTimeline)));
    cw.hidden = wts.length === 0;

    const rows = all.filter((x) => (!state.filterType.size || state.filterType.has(x.type)) && (!state.filterWt.size || x.brief || state.filterWt.has(x.wt))).slice(0, 300);
    $("#tl-count").textContent = rows.length ? `${rows.length}건${all.length > rows.length ? ` / ${all.length}` : ""}` : "";
    const ul = $("#timeline"); ul.replaceChildren();
    if (!rows.length) { ul.append(el("li", { class: "empty", style: "display:block;border:0" }, "표시할 이벤트가 없습니다.")); return; }
    let lastDay = null;
    for (const x of rows) {
      const day = fmtDay(x.ts);
      if (day !== lastDay) { ul.append(el("li", { style: "border:0;padding:0" }, el("div", { class: "day" }, day))); lastDay = day; }
      ul.append(el("li", { class: x.brief ? "brief" : "", title: new Date(x.ts).toLocaleString("ko-KR") },
        el("span", { class: "t" }, fmtTime(x.ts)),
        el("div", { class: "ev" },
          el("span", { class: "kind" }, x.brief ? "📝 브리핑" : (EVENT_KO[x.type] ?? x.type)),
          x.wt ? el("span", { class: "wt" }, x.wt) : null,
          x.raw.notification_type ? el("span", { class: "tag" }, x.raw.notification_type) : null,
          x.msg ? el("span", { class: "msg" }, String(x.msg).slice(0, 300)) : null,
        ),
      ));
    }
  }

  // ---------- config ----------
  function renderConfig() {
    const c = state.config; if (!c) return;
    $("#c-hb").value = c.heartbeat_minutes ?? "";
    $("#c-sig").value = c.signal_check_minutes ?? "";
    $("#c-bt").value = c.briefing_time ?? "";
    $("#c-qon").checked = !!c.quiet_hours;
    $("#c-qs").value = c.quiet_hours?.start ?? "23:00";
    $("#c-qe").value = c.quiet_hours?.end ?? "08:00";
    $("#c-qs").disabled = $("#c-qe").disabled = !c.quiet_hours;
    // Toggles come from the keys of config.sources, so new sources appear automatically.
    const box = $("#c-sources"); box.replaceChildren();
    for (const [k, v] of Object.entries(c.sources ?? {})) {
      box.append(el("label", {}, el("input", { type: "checkbox", "data-src": k, checked: !!v }), " ", SOURCE_LABEL[k] ?? k));
    }
    if (!box.children.length) box.append(el("span", { class: "empty" }, "소스 없음"));
    $("#c-model").value = c.claude_model ?? "";
    $("#c-turns").value = c.claude_max_turns ?? "";
    $("#c-msg").textContent = ""; $("#c-msg").className = "msg";
  }
  $("#c-qon").addEventListener("change", (e) => { $("#c-qs").disabled = $("#c-qe").disabled = !e.target.checked; });
  $("#cfg").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("#c-msg"), btn = $("#c-save");
    const sources = {};
    for (const cb of document.querySelectorAll("[data-src]")) sources[cb.dataset.src] = cb.checked;
    const body = {
      heartbeat_minutes: Number($("#c-hb").value),
      signal_check_minutes: Number($("#c-sig").value),
      briefing_time: $("#c-bt").value,
      quiet_hours: $("#c-qon").checked ? { start: $("#c-qs").value || "23:00", end: $("#c-qe").value || "08:00" } : null,
      sources,
      claude_model: $("#c-model").value.trim() || null,
      claude_max_turns: Number($("#c-turns").value),
    };
    btn.disabled = true; msg.className = "msg"; msg.textContent = "저장 중…";
    try {
      state.config = await api("/api/config", { method: "PUT", body: JSON.stringify(body) });
      renderConfig(); msg.className = "msg ok"; msg.textContent = "저장됨 (다음 heartbeat 부터 적용)";
    } catch (err) {
      console.error(err); msg.className = "msg err"; msg.textContent = `저장 실패: ${err.message}`;
    } finally { btn.disabled = false; }
  });

  // ---------- loaders ----------
  async function loadState() {
    try { state.state = await api("/api/state"); renderHeader(); renderAttention(); renderSessions(); }
    catch (e) { console.warn("state", e.message); $("#alive-dot").className = "dot off"; $("#alive-text").textContent = "서버에 연결할 수 없음"; }
  }
  async function loadEvents() {
    try { state.events = await api("/api/events?days=2"); renderTimeline(); }
    catch (e) { console.warn("events", e.message); }
  }
  async function loadBriefings() {
    try { state.briefings = await api("/api/briefings?limit=30"); renderBriefings(); renderTimeline(); }
    catch (e) { console.warn("briefings", e.message); }
  }
  async function loadConfig() {
    try { state.config = await api("/api/config"); renderConfig(); }
    catch (e) { console.warn("config", e.message); }
  }

  $("#btn-hb").addEventListener("click", () => runHeartbeat(false));
  $("#btn-daily").addEventListener("click", () => runHeartbeat(true));
  for (const b of document.querySelectorAll("[data-refresh]")) {
    b.addEventListener("click", () => ({ briefings: loadBriefings, events: loadEvents, config: loadConfig })[b.dataset.refresh]?.());
  }

  loadState(); loadEvents(); loadBriefings(); loadConfig();
  setInterval(loadState, POLL_MS);
  // Relative times drift; re-render cheap views each minute.
  setInterval(() => { renderHeader(); renderAttention(); renderSessions(); }, 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadState(); });
})();
</script>
</body>
</html>
