<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ned · Inbox</title>
<style>
  /* Direction C — "Inbox / triage": Linear/Superhuman split. List left, detail right, j/k to move. Dark-first, one accent. */
  :root {
    color-scheme: dark light;
    --bg: #101012; --side: #141417; --pane: #18181c; --hover: #1f1f24; --sel: #26263a; --line: #26262c;
    --fg: #e8e8ec; --dim: #9a9aa6; --faint: #5e5e6a; --accent: #8b7cf6; --accent-fg: #fff;
    --warn: #e5a54b; --err: #f07178; --ok: #7fd18b;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f7f8; --side: #fbfbfc; --pane: #ffffff; --hover: #f0f0f3; --sel: #ebe8fd; --line: #e6e6ea;
      --fg: #1d1d22; --dim: #62626e; --faint: #a3a3ad; --accent: #6e5bf0; --warn: #b26b00; --err: #c9353f; --ok: #2f8a3e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; letter-spacing: .005em; }
  a { color: var(--accent); text-decoration: none; }
  .app { display: grid; grid-template-columns: 400px minmax(0, 1fr); height: 100%; }
  .list { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .top h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .top .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .top .pulse.off { background: var(--err); }
  .top .meta { color: var(--faint); font-size: 12px; margin-left: auto; }
  .tabs { display: flex; gap: 4px; padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  .tab { padding: 4px 10px; border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 13px; user-select: none; }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab.on { background: var(--hover); color: var(--fg); font-weight: 500; }
  .tab .n { color: var(--faint); margin-left: 4px; font-size: 12px; }
  .items { overflow: auto; flex: 1; padding: 4px 0; }
  .grp { padding: 10px 16px 4px; font-size: 11px; color: var(--faint); font-weight: 600; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 14px 8px 12px; margin: 0 6px; border-radius: 7px; cursor: pointer; align-items: baseline; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .row .ic { font-size: 14px; text-align: center; }
  .row .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .row .tm { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .row .sb { grid-column: 2 / 4; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.read .tt { color: var(--dim); font-weight: 400; }
  .row .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 2px; }
  .dot.waiting { background: var(--warn); } .dot.error { background: var(--err); } .dot.hi { background: var(--accent); }
  .okrun { margin: 6px 12px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 7px; color: var(--faint); font-size: 12px; }
  .keys { border-top: 1px solid var(--line); padding: 7px 14px; color: var(--faint); font-size: 11.5px; display: flex; gap: 12px; flex-wrap: wrap; }
  kbd { font: 11px var(--mono); background: var(--hover); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--dim); }
  .detail { background: var(--pane); overflow: auto; min-height: 0; }
  .dwrap { max-width: 720px; padding: 28px 36px 40px; }
  .crumb { color: var(--faint); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .crumb .pill { background: var(--hover); color: var(--dim); border-radius: 999px; padding: 1px 8px; }
  .detail h2 { font-size: 21px; line-height: 1.35; margin: 10px 0 8px; font-weight: 600; letter-spacing: -.01em; }
  .detail .body { color: var(--dim); font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .acts { display: flex; gap: 8px; margin: 20px 0 26px; flex-wrap: wrap; }
  .btn { font: 500 13px var(--sans); border-radius: 7px; padding: 6px 12px; border: 1px solid var(--line); background: var(--hover); color: var(--fg); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .7; }
  .ctx h3 { font-size: 11px; color: var(--faint); letter-spacing: .05em; margin: 22px 0 8px; font-weight: 600; }
  .ctx .tl { border-left: 1px solid var(--line); margin-left: 4px; padding-left: 14px; }
  .ctx .tl div { position: relative; padding: 3px 0; color: var(--dim); font-size: 13px; }
  .ctx .tl div::before { content: ""; position: absolute; left: -18px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .ctx .tl div.hot::before { background: var(--warn); }
  .ctx .tl .h { font: 11.5px var(--mono); color: var(--faint); margin-right: 8px; }
  .ctx ul { margin: 0; padding-left: 18px; color: var(--dim); } .ctx li { margin: 3px 0; }
  .zero { height: 100%; display: grid; place-items: center; text-align: center; color: var(--faint); }
  .zero .big { font-size: 40px; } .zero p { margin: 6px 0 0; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .detail { display: none; } .detail.open { display: block; position: fixed; inset: 0; } }
</style>
</head>
<body>
<div class="app">
  <section class="list">
    <div class="top"><span class="pulse" id="pulse"></span><h1>Ned</h1><span class="meta" id="meta"></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items" tabindex="0"></div>
    <div class="keys"><span><kbd>j</kbd><kbd>k</kbd> 이동</span><span><kbd>e</kbd> 완료</span><span><kbd>⏎</kbd> 열기</span><span><kbd>1</kbd><kbd>2</kbd> 탭</span><span><kbd>r</kbd> 점검</span></div>
  </section>
  <section class="detail" id="detail"></section>
</div>
<script src="fixture.js"></script>
<script>
(async () => {
  "use strict";
  const N = window.NED, e = N.esc;
  const d = await N.load();
  const ui = { tab: "priority", sel: 0, read: new Set() };
  const $ = (id) => document.getElementById(id);

  /** One inbox = attention (needs a decision) + briefing updates/fyi (read-only), NED_OK runs folded. */
  function model() {
    const sessBy = Object.fromEntries(d.state.sessions.map((s) => [s.id, s]));
    const pri = d.state.attention.map((a) => {
      const sess = a.source === "sessions" ? sessBy[a.id.replace("session:", "")] : null;
      return { key: a.id, att: a, kind: a.kind, title: a.title, detail: a.detail, url: a.url, ts: a.ts, sev: sess ? sess.status : "hi", sess, briefing: d.briefings.find((b) => b.id === a.source) };
    });
    const other = [];
    for (const b of d.briefings) {
      if (b.status !== "UPDATE") continue;
      for (const [sec, label] of [["updates", "업데이트"], ["fyi", "참고"]]) (b[sec] || []).forEach((x, i) =>
        other.push({ key: `${b.id}:${sec}:${i}`, kind: x.kind ?? "other", title: x.title, detail: x.detail, url: x.url, ts: b.ts, label, briefing: b }));
    }
    other.sort((a, b) => b.ts - a.ts);
    const ok = d.briefings.filter((b) => b.status === "NED_OK");
    return { pri, other, ok };
  }

  function current(m) { return ui.tab === "priority" ? m.pri : m.other; }

  function draw() {
    const m = model(), list = current(m), s = d.state;
    ui.sel = Math.max(0, Math.min(ui.sel, list.length - 1));
    $("pulse").className = "pulse " + (N.alive(s) ? "" : "off");
    $("meta").textContent = `다음 점검 ${N.rel(s.next_heartbeat_at)}${s.quiet ? " · 🌙" : ""}${d.live ? "" : " · fixture"}`;
    $("tabs").innerHTML = `<span class="tab ${ui.tab === "priority" ? "on" : ""}" data-t="priority">우선<span class="n">${m.pri.length}</span></span><span class="tab ${ui.tab === "other" ? "on" : ""}" data-t="other">기타<span class="n">${m.other.length}</span></span>`;
    for (const t of $("tabs").children) t.onclick = () => { ui.tab = t.dataset.t; ui.sel = 0; draw(); };

    let html = "", lastDay = "";
    list.forEach((it, i) => {
      const day = N.dayLabel(it.ts);
      if (day !== lastDay) { html += `<div class="grp">${day}</div>`; lastDay = day; }
      html += `<div class="row ${i === ui.sel ? "sel" : ""} ${ui.read.has(it.key) ? "read" : ""}" data-i="${i}">
        <span class="ic">${N.KIND_ICON[it.kind] ?? "·"}</span>
        <span class="tt">${it.sev ? `<span class="dot ${e(it.sev)}"></span>` : ""}${e(it.title)}</span>
        <span class="tm">${N.rel(it.ts)}</span>
        <span class="sb">${e(it.label ? it.label + " · " : "")}${e(it.detail ?? N.KIND_KO[it.kind] ?? "")}</span></div>`;
    });
    if (!list.length) html += `<div class="grp">비어 있음</div>`;
    if (m.ok.length) html += `<div class="okrun">✓ NED_OK ×${m.ok.length} — 마지막 ${N.rel(m.ok[0].ts)}. 변화 없는 점검은 접어 둡니다.</div>`;
    $("items").innerHTML = html;
    for (const r of $("items").querySelectorAll(".row")) r.onclick = () => { ui.sel = +r.dataset.i; draw(); $("detail").classList.add("open"); };
    $("items").querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
    detail(list[ui.sel], m);
  }

  function detail(it, m) {
    const box = $("detail");
    if (!it) {
      box.innerHTML = `<div class="zero"><div><div class="big">✓</div><p style="font-size:15px;color:var(--dim)">${ui.tab === "priority" ? "처리할 것이 없습니다" : "읽을 것이 없습니다"}</p><p>다음 점검 ${N.rel(d.state.next_heartbeat_at)} · NED_OK ${m.ok.length}회</p></div></div>`;
      return;
    }
    ui.read.add(it.key);
    let ctx = "";
    if (it.sess) {
      const evs = d.events.filter((x) => x.session_id === it.sess.id).slice(-8).reverse();
      ctx = `<h3>세션 · ${e(it.sess.worktree)}</h3>
        <div class="body" style="font-size:13px;margin-bottom:8px">상태 ${e(N.STATUS_KO[it.sess.status])} · 시작 ${N.rel(it.sess.since)} · 서브에이전트 ${it.sess.subagents_active}</div>
        ${it.sess.last_prompt ? `<div class="body" style="font-size:13px">» ${e(it.sess.last_prompt)}</div>` : ""}
        <h3>최근 이벤트</h3><div class="tl">${evs.map((x) => `<div class="${x.event === "Notification" || x.event === "StopFailure" ? "hot" : ""}"><span class="h">${N.hhmm(x.ts)}</span>${e(N.EVENT_KO[x.event] ?? x.event)}${x.message || x.prompt ? ` — ${e(String(x.message || x.prompt).slice(0, 90))}` : ""}</div>`).join("")}</div>`;
    } else if (it.briefing) {
      const b = it.briefing, all = [...b.action_items, ...b.updates, ...b.fyi].filter((x) => x.title !== it.title);
      ctx = `<h3>출처 · ${b.type === "daily" ? "아침 브리핑" : "점검"} ${N.hhmm(b.ts)}</h3>
        ${b.headline ? `<div class="body" style="font-size:13.5px;color:var(--fg)">${e(b.headline)}</div>` : ""}
        ${all.length ? `<h3>같은 브리핑의 다른 항목</h3><ul>${all.map((x) => `<li>${N.KIND_ICON[x.kind] ?? ""} ${e(x.title)}</li>`).join("")}</ul>` : ""}
        <h3>비용</h3><div class="body" style="font:12px var(--mono)">$${(b.cost_usd ?? 0).toFixed(3)} · ${e(b.id)}</div>`;
    }
    box.innerHTML = `<div class="dwrap">
      <div class="crumb"><span class="pill">${N.KIND_ICON[it.kind] ?? ""} ${e(N.KIND_KO[it.kind] ?? it.kind)}</span><span>${it.att ? "행동 필요" : e(it.label)}</span><span>· ${N.rel(it.ts)}</span></div>
      <h2>${e(it.title)}</h2>
      ${it.detail ? `<div class="body">${e(it.detail)}</div>` : ""}
      <div class="acts">
        ${it.url ? `<a class="btn primary" href="${e(it.url)}" target="_blank" rel="noopener">열기 <kbd>⏎</kbd></a>` : ""}
        ${it.att ? `<button class="btn" id="done">완료 <kbd>e</kbd></button>` : ""}
      </div>
      <div class="ctx">${ctx}</div></div>`;
    box.querySelector("#done")?.addEventListener("click", done);
  }

  async function done() {
    const it = current(model())[ui.sel];
    if (!it?.att) return;
    await N.dismiss(it.att.id); draw();
  }

  document.addEventListener("keydown", async (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const list = current(model());
    if (ev.key === "j" || ev.key === "ArrowDown") { ui.sel = Math.min(list.length - 1, ui.sel + 1); draw(); ev.preventDefault(); }
    else if (ev.key === "k" || ev.key === "ArrowUp") { ui.sel = Math.max(0, ui.sel - 1); draw(); ev.preventDefault(); }
    else if (ev.key === "e") done();
    else if (ev.key === "Enter" && list[ui.sel]?.url) window.open(list[ui.sel].url, "_blank", "noopener");
    else if (ev.key === "1") { ui.tab = "priority"; ui.sel = 0; draw(); }
    else if (ev.key === "2") { ui.tab = "other"; ui.sel = 0; draw(); }
    else if (ev.key === "r") { $("meta").textContent = "점검 중… (1~3분)"; await N.heartbeat(false); draw(); }
    else if (ev.key === "Escape") $("detail").classList.remove("open");
  });
  draw();
})();
</script>
</body>
</html>
