<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ned · Command center</title>
<style>
  /* Direction B — "Command center": dense 3-column ops board. Status colors are the only color. */
  :root {
    color-scheme: dark light;
    --bg: #0b0d10; --panel: #11151a; --panel2: #161b21; --line: #222a33; --fg: #d6dde4; --dim: #7d8a97; --faint: #4c5763;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --run: #58a6ff; --sel: #1f2a36;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f5f7; --panel: #ffffff; --panel2: #f7f9fb; --line: #dfe4ea; --fg: #1c2229; --dim: #5d6b79; --faint: #9aa6b2;
      --ok: #1a7f37; --warn: #9a6700; --err: #cf222e; --run: #0969da; --sel: #e8f0fb; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--run); text-decoration: none; } a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .bar { display: flex; align-items: center; gap: 18px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow-x: auto; }
  .bar b { color: var(--fg); font-weight: 600; } .bar .k { color: var(--dim); }
  .bar .brand { font-weight: 700; letter-spacing: .08em; }
  .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .led.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .led.err { background: var(--err); }
  .bar .sp { flex: 1; }
  .bar button, .btn { font: 600 11px var(--mono); letter-spacing: .04em; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; text-transform: uppercase; }
  .bar button:hover, .btn:hover { border-color: var(--dim); } .bar button:disabled { opacity: .5; cursor: progress; }
  .grid { display: grid; grid-template-columns: 200px minmax(0, 1fr) 320px; height: calc(100% - 37px); }
  .col { overflow: auto; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .ph { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); font: 600 11px var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  .ph .c { color: var(--fg); } .ph .sp { flex: 1; }
  /* left nav */
  .nav { padding: 6px 0 12px; }
  .nav .g { padding: 10px 12px 4px; font: 600 10px var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
  .nav .it { display: flex; gap: 8px; align-items: center; padding: 3px 12px; cursor: pointer; color: var(--dim); user-select: none; }
  .nav .it:hover { color: var(--fg); background: var(--panel2); }
  .nav .it.on { color: var(--fg); background: var(--sel); box-shadow: inset 2px 0 0 var(--run); }
  .nav .it .ct { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .nav .it .sw { width: 6px; height: 6px; border-radius: 1px; background: var(--faint); }
  /* attention rows */
  .rows { width: 100%; border-collapse: collapse; }
  .rows td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rows tr:hover td { background: var(--panel2); }
  .rows td.s { width: 3px; padding: 0; }
  .rows td.k { width: 72px; font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
  .rows td.ti .d { color: var(--dim); font-size: 12px; margin-top: 1px; }
  .rows td.w { width: 64px; font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; text-align: right; }
  .rows td.x { width: 30px; text-align: right; }
  .x button { background: none; border: 1px solid transparent; color: var(--faint); cursor: pointer; font: 12px var(--mono); border-radius: 3px; padding: 0 5px; }
  .x button:hover { color: var(--fg); border-color: var(--line); }
  .sev-waiting, .sev-hi { background: var(--warn); } .sev-error { background: var(--err); } .sev-lo { background: var(--line); }
  /* log */
  .log { font-family: var(--mono); font-size: 12px; padding: 4px 0 16px; }
  .log .ln { display: grid; grid-template-columns: 50px 140px 130px minmax(0, 1fr); gap: 10px; padding: 2px 12px; white-space: nowrap; }
  .log .ln:hover { background: var(--panel2); }
  .log .ln .m { overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .log .ln .t { color: var(--faint); } .log .ln .w { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .log .ln.b .e { color: var(--run); }
  .e-StopFailure { color: var(--err); } .e-Notification { color: var(--warn); } .e-Stop { color: var(--ok); }
  .log .day { padding: 8px 12px 2px; color: var(--faint); font-size: 11px; }
  /* right */
  .sess { padding: 8px 10px; display: grid; gap: 6px; }
  .card { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 7px 9px; border-left: 3px solid var(--faint); }
  .card.waiting { border-left-color: var(--warn); } .card.error { border-left-color: var(--err); } .card.running { border-left-color: var(--run); } .card.done { border-left-color: var(--ok); }
  .card .h { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 12px; }
  .card .h b { font-weight: 600; } .card .h .st { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .st.waiting { color: var(--warn); } .st.error { color: var(--err); } .st.running { color: var(--run); } .st.done { color: var(--ok); }
  .card .h .r { margin-left: auto; color: var(--faint); }
  .card .b { color: var(--dim); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .strip { display: flex; gap: 2px; padding: 10px 12px 4px; align-items: flex-end; height: 44px; }
  .strip i { flex: 1; background: var(--line); height: 10px; border-radius: 1px; }
  .strip i.u { background: var(--warn); height: 28px; } .strip i.o { background: var(--faint); height: 10px; }
  .strip-l { display: flex; justify-content: space-between; padding: 0 12px 8px; font: 10px var(--mono); color: var(--faint); }
  .bl { font-size: 12px; }
  .bl details { border-bottom: 1px solid var(--line); }
  .bl summary { display: grid; grid-template-columns: 42px 52px 1fr; gap: 8px; padding: 5px 12px; cursor: pointer; list-style: none; font-family: var(--mono); font-size: 11px; }
  .bl summary::-webkit-details-marker { display: none; }
  .bl summary .hl { font-family: var(--sans); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bl .ok summary { color: var(--faint); } .bl .ok summary .hl { color: var(--faint); }
  .bl .up summary .s { color: var(--warn); }
  .bl .body { padding: 2px 12px 10px 24px; color: var(--dim); }
  .bl .body .sec { font: 600 10px var(--mono); letter-spacing: .08em; color: var(--faint); margin: 6px 0 2px; text-transform: uppercase; }
  .bl .body div.i { color: var(--fg); margin: 2px 0; }
  .empty { padding: 14px 12px; color: var(--faint); font-family: var(--mono); font-size: 12px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; height: auto; } .col { border-right: 0; border-bottom: 1px solid var(--line); } .col.nav-col { display: none; } .log .ln { grid-template-columns: 44px 1fr; } .log .ln .w, .log .ln .m { grid-column: 2; } }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="grid">
  <aside class="col nav-col"><div class="nav" id="nav"></div></aside>
  <main class="col" id="center"></main>
  <aside class="col" id="right"></aside>
</div>
<script src="fixture.js"></script>
<script>
(async () => {
  "use strict";
  const N = window.NED, e = N.esc;
  const d = await N.load();
  const F = { kind: null, wt: null, type: null };
  const $ = (id) => document.getElementById(id);

  function bar() {
    const s = d.state, alive = N.alive(s);
    const cost = d.briefings.filter((b) => Date.now() - b.ts < 24 * 3600e3).reduce((a, b) => a + (b.cost_usd || 0), 0);
    $("bar").innerHTML = `
      <span class="brand">NED</span>
      <span><span class="led ${alive ? "ok" : "err"}"></span><b>${alive ? "ALIVE" : "STALE"}</b> <span class="k">pid ${s.daemon_pid}</span></span>
      <span><span class="k">hb</span> <b>${N.rel(s.last_heartbeat_at)}</b></span>
      <span><span class="k">next</span> <b>${N.rel(s.next_heartbeat_at)}</b></span>
      <span><span class="k">quiet</span> <b>${s.quiet ? "ON" : "off"}</b></span>
      <span><span class="k">attn</span> <b style="color:${s.attention.length ? "var(--warn)" : "inherit"}">${s.attention.length}</b></span>
      <span><span class="k">24h llm</span> <b>$${cost.toFixed(2)}</b></span>
      <span class="k">${d.live ? "live" : "fixture"}</span>
      <span class="sp"></span>
      <button data-hb="0">점검 ⏎</button><button data-hb="1">아침 브리핑</button>`;
    for (const b of document.querySelectorAll("[data-hb]")) b.onclick = async () => {
      for (const x of document.querySelectorAll("[data-hb]")) x.disabled = true;
      b.textContent = "running…"; await N.heartbeat(b.dataset.hb === "1"); bar();
    };
  }

  function nav() {
    const kinds = {}, wts = {}, types = {};
    for (const a of d.state.attention) kinds[a.kind] = (kinds[a.kind] || 0) + 1;
    for (const x of N.timeline(d)) { if (x.wt) wts[x.wt] = (wts[x.wt] || 0) + 1; types[x.type] = (types[x.type] || 0) + 1; }
    const grp = (title, key, obj, label) => `<div class="g">${title}</div>` +
      `<div class="it ${F[key] == null ? "on" : ""}" data-k="${key}" data-v="">전체</div>` +
      Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="it ${F[key] === k ? "on" : ""}" data-k="${key}" data-v="${e(k)}"><span class="sw"></span>${e(label(k))}<span class="ct">${n}</span></div>`).join("");
    $("nav").innerHTML = grp("source", "kind", kinds, (k) => (N.KIND_ICON[k] ?? "") + " " + (N.KIND_KO[k] ?? k)) + grp("worktree", "wt", wts, (k) => k) + grp("event", "type", types, (k) => N.EVENT_KO[k] ?? k);
    for (const it of $("nav").querySelectorAll(".it")) it.onclick = () => { F[it.dataset.k] = it.dataset.v || null; draw(); };
  }

  function center() {
    const att = d.state.attention.filter((a) => !F.kind || a.kind === F.kind);
    const sessBy = Object.fromEntries(d.state.sessions.map((s) => [s.id, s.status]));
    const sev = (a) => a.source === "sessions" ? (sessBy[a.id.replace("session:", "")] || "waiting") : "hi";
    const rows = att.map((a) => `<tr>
      <td class="s sev-${sev(a)}"></td>
      <td class="k">${N.KIND_ICON[a.kind] ?? ""} ${e(N.KIND_KO[a.kind] ?? a.kind)}</td>
      <td class="ti">${a.url ? `<a href="${e(a.url)}" target="_blank" rel="noopener">${e(a.title)}</a>` : e(a.title)}${a.detail ? `<div class="d">${e(a.detail)}</div>` : ""}</td>
      <td class="w">${N.rel(a.ts)}</td>
      <td class="x"><button title="닫기" data-id="${e(a.id)}">✕</button></td></tr>`).join("");
    const tl = N.timeline(d).filter((x) => (!F.wt || x.wt === F.wt || x.brief) && (!F.type || x.type === F.type));
    let last = ""; const lines = tl.map((x) => {
      const day = N.dayLabel(x.ts); const sep = day !== last ? `<div class="day">── ${day}</div>` : ""; last = day;
      return sep + `<div class="ln ${x.brief ? "b" : ""}" title="${e(new Date(x.ts).toLocaleString("ko-KR"))}"><span class="t">${N.hhmm(x.ts)}</span><span class="e e-${e(x.type)}">${x.brief ? "BRIEFING" : e(x.type)}</span><span class="w">${e(x.wt || "—")}</span><span class="m">${e(String(x.msg || "").slice(0, 200))}</span></div>`;
    }).join("");
    $("center").innerHTML = `
      <div class="ph">attention <span class="c">${att.length}</span><span class="sp"></span><span>${F.kind ? e(N.KIND_KO[F.kind]) : ""}</span></div>
      ${att.length ? `<table class="rows">${rows}</table>` : `<div class="empty">// all clear — next check ${N.rel(d.state.next_heartbeat_at)}</div>`}
      <div class="ph">timeline <span class="c">${tl.length}</span><span class="sp"></span><span>${[F.wt, F.type].filter(Boolean).map(e).join(" · ")}</span></div>
      <div class="log">${lines || `<div class="empty">// no events</div>`}</div>`;
    for (const b of $("center").querySelectorAll("button[data-id]")) b.onclick = async () => { await N.dismiss(b.dataset.id); draw(); };
  }

  function right() {
    const ss = d.state.sessions;
    const cards = ss.map((s) => `<div class="card ${s.status}">
      <div class="h"><b>${e(s.worktree)}</b><span class="st ${s.status}">${e(s.status)}</span>${s.subagents_active ? `<span style="color:var(--dim)">+${s.subagents_active} sub</span>` : ""}<span class="r">${N.rel(s.last_event_ts)}</span></div>
      <div class="b">${e(s.last_summary ?? s.last_prompt ?? "")}</div></div>`).join("");
    // 24 one-hour buckets: amber = UPDATE, grey = NED_OK only, empty = no heartbeat recorded.
    const now = Date.now(), buckets = Array.from({ length: 24 }, () => "");
    for (const b of d.briefings) { const i = 23 - Math.floor((now - b.ts) / 3600e3); if (i >= 0 && i < 24) buckets[i] = b.status === "UPDATE" ? "u" : (buckets[i] || "o"); }
    const bl = d.briefings.map((b) => {
      const ok = b.status === "NED_OK";
      const sec = (t, xs) => xs?.length ? `<div class="sec">${t}</div>` + xs.map((x) => `<div class="i">${N.KIND_ICON[x.kind] ?? "·"} ${x.url ? `<a href="${e(x.url)}" target="_blank" rel="noopener">${e(x.title)}</a>` : e(x.title)}</div>`).join("") : "";
      return `<details class="${ok ? "ok" : "up"}"><summary><span>${N.hhmm(b.ts)}</span><span class="s">${ok ? "NED_OK" : "UPDATE"}</span><span class="hl">${b.type === "daily" ? "[daily] " : ""}${e(b.headline ?? (ok ? "—" : ""))}</span></summary>
        <div class="body">${sec("action", b.action_items)}${sec("updates", b.updates)}${sec("fyi", b.fyi)}${sec("sessions", b.sessions)}
        <div class="sec">meta</div><div class="mono">${e(b.id)} · $${(b.cost_usd ?? 0).toFixed(3)}</div>${b.raw ? `<pre class="mono" style="white-space:pre-wrap;margin:4px 0 0">${e(b.raw)}</pre>` : ""}</div></details>`;
    }).join("");
    $("right").innerHTML = `
      <div class="ph">sessions <span class="c">${ss.length}</span></div>
      ${ss.length ? `<div class="sess">${cards}</div>` : `<div class="empty">// no active sessions</div>`}
      <div class="ph">heartbeats · 24h</div>
      <div class="strip">${buckets.map((c) => `<i class="${c}"></i>`).join("")}</div>
      <div class="strip-l"><span>-24h</span><span>now</span></div>
      <div class="ph">briefings <span class="c">${d.briefings.length}</span></div>
      <div class="bl">${bl || `<div class="empty">// none yet</div>`}</div>`;
  }

  function draw() { bar(); nav(); center(); right(); }
  draw();
  setInterval(bar, 30000);
})();
</script>
</body>
</html>
